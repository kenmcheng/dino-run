name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: |
          mkdir -p test-results
          ./test.sh --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results/junit.xml
      - name: Check no control signal is read out of comment text
        if: hashFiles('.forgejo/scripts/no-comment-control-signals.sh') != ''
        run: bash .forgejo/scripts/no-comment-control-signals.sh
      - name: Write test report summary
        if: always()
        run: |
          if [ -f test-results/junit.xml ]; then
            total=$(grep -c '<testcase ' test-results/junit.xml || true)
            fails=$(grep -c '<failure' test-results/junit.xml || true)
            { echo "## Test report"; echo; echo "- Total: ${total}"; echo "- Failed: ${fails}"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Test report: no junit.xml produced (run crashed before tests?)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: test-results/

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check no local host, LAN address or board key reference
        run: bash .github/scripts/no-local-refs.sh
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks (PR diff)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --no-banner --redact --exit-code 1 --log-opts="$BASE..$HEAD" .
      - name: Run gitleaks (full history)
        if: github.event_name == 'push'
        run: gitleaks git --no-banner --redact --exit-code 1 .
