name: Bug report
description: Something isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step, so the bug can be reproduced from a fresh checkout.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 129 on macOS 14
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build / commit
      description: Commit SHA, or the date of the deployed build you hit this on.
    validations:
      required: true
